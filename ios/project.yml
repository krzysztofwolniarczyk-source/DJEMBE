name: BartekJones
options:
  bundleIdPrefix: pl.bartekjones
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  BartekJones:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      # Jedno źródło prawdy: aplikacja webowa leży w korzeniu repo
      # i trafia wprost do bundle'a jako index.html.
      - path: ../index.html
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.bartekjones.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Bartek Jones
        CFBundleName: BartekJones
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSMicrophoneUsageDescription: >-
          Mikrofon jest potrzebny tylko do stroika — aplikacja słucha struny,
          żeby pokazać, w którą stronę kręcić kluczem. Nic nie jest nagrywane
          ani wysyłane.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Strona jest podawana z http://127.0.0.1 (LocalServer) — ATS musi
        # przepuścić zwykły HTTP na pętli zwrotnej.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
